<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片选择</title>
    <style>
        .button {
            display: block;
            width: 200px;
            height: 40px;
            margin: 20px auto;
            background-color: #6200EE;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        #preview {
            max-width: 100%;
            height: auto;
            margin: 20px auto;
            display: none;
        }
    </style>
</head>
<body>
    <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleFileSelect(event)">
    <button class="button" onclick="selectImageH5()">H5选择图片</button>
    <button class="button" onclick="selectImage()">原生选择图片</button>
    <img id="preview" src="" alt="预览图片">

    <script>
        function selectImageH5() {
            document.getElementById('fileInput').click();
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                if (!file.type.startsWith('image/')) {
                    alert('请选择图片文件');
                    return;
                }
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('preview');
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                };
                reader.onerror = function() {
                    alert('读取文件失败');
                };
                reader.readAsDataURL(file);
            }
        }

        function selectImage() {
            if (window.JSBridge) {
                JSBridge.chooseImage();
            } else {
                alert('JSBridge not found');
            }
        }

        function onImageSelected(base64Image) {
            const preview = document.getElementById('preview');
            preview.src = 'data:image/jpeg;base64,' + base64Image;
            preview.style.display = 'block';
        }
    </script>
</body>
</html>
